<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MyPet - Your digital companion">
    <title>MyPet - Digital Pet App</title>
    <link rel="stylesheet" href="styles/main.css?v=acc-2">
</head>
<body>
    <!-- Decorative backyard scene (behind the app UI) -->
    <div class="backyard-scene" aria-hidden="true">
        <div class="backyard-sky"></div>
        <div class="backyard-sun"></div>
        <div class="backyard-cloud backyard-cloud--1"></div>
        <div class="backyard-cloud backyard-cloud--2"></div>
        <div class="backyard-hill"></div>
        <div class="backyard-grass"></div>
    </div>

    <div id="app" class="app-container">
        <!-- Pet Creator View -->
        <div id="creator-view" class="view hidden">
            <div class="creator-container">
                <h1 class="app-title">Create Your Pet</h1>
                <form id="pet-form" class="pet-form">
                    <div class="form-group">
                        <label for="pet-type">Choose your pet:</label>
                        <div class="pet-type-selector">
                            <button type="button" class="type-btn" data-type="cat">
                                <span class="type-icon">🐱</span>
                                <span class="type-label">Cat</span>
                            </button>
                            <button type="button" class="type-btn" data-type="dog">
                                <span class="type-icon">🐶</span>
                                <span class="type-label">Dog</span>
                            </button>
                        </div>
                        <input type="hidden" id="pet-type" name="type" required>
                    </div>

                    <div id="appearance-builder" class="appearance-builder hidden">
                        <h2 class="appearance-title">Build your pet's look</h2>

                        <div id="appearance-preview" class="appearance-preview" aria-live="polite"></div>

                        <div class="form-group">
                            <span class="appearance-label">Fur color</span>
                            <div class="color-picker-row">
                                <div id="color-swatches" class="color-swatches"></div>
                                <label class="custom-color-label" for="pet-color">
                                    Any color
                                    <input type="color" id="pet-color" name="color" value="#C68642">
                                </label>
                            </div>
                        </div>

                        <div id="appearance-slot-menus" class="appearance-slot-menus"></div>
                    </div>

                    <div class="form-group">
                        <label for="pet-name">Pet Name:</label>
                        <input
                            type="text"
                            id="pet-name"
                            name="name"
                            placeholder="Enter your pet's name"
                            maxlength="20"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="pet-description">Story (optional):</label>
                        <textarea
                            id="pet-description"
                            name="description"
                            placeholder="Tell a short story about your pet"
                            maxlength="100"
                            rows="2"
                        ></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Create Pet</button>
                </form>
            </div>
        </div>

        <!-- Main Game View -->
        <div id="main-view" class="view hidden">
            <div class="game-container">
                <header class="game-header">
                    <h1 class="app-title">MyPet</h1>
                    <button id="reset-btn" class="btn btn-secondary btn-small">New Pet</button>
                </header>

                <!-- Pet Display -->
                <div id="pet-display" class="pet-display">
                    <!-- Dynamically populated -->
                </div>

                <!-- Stats Display -->
                <div id="stats-display" class="stats-display">
                    <!-- Dynamically populated -->
                </div>

                <!-- Activity Controls -->
                <div id="activity-controls" class="activity-controls">
                    <!-- Dynamically populated -->
                </div>
            </div>
        </div>

        <!-- Loading View -->
        <div id="loading-view" class="view">
            <div class="loading-container">
                <p>Loading...</p>
            </div>
        </div>
    </div>

    <!-- Scripts: app.js imports the rest of the modules -->
    <script type="module" src="js/app.js?v=acc-2"></script>
</body>
</html>
